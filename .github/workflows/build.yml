name: Veyron Proyect - Windows Build

on:
  push:
    branches:
      - main
      - "ci/**"
      - "ui/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyron-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Test C++ core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure standalone core
        run: cmake -S . -B build-core -DVEYRON_STANDALONE_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build core and tests
        run: cmake --build build-core --config Release --parallel

      - name: Run core tests
        run: ctest --test-dir build-core --build-config Release --output-on-failure

  build:
    name: Build Geode Mod (Windows x64)
    runs-on: windows-latest
    needs: core-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Veyron Proyect
        id: geode-build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          cli: latest
          target: Win64
          build-config: Release

      - name: Verify Geode package
        shell: pwsh
        env:
          BUILD_OUTPUT: ${{ steps.geode-build.outputs.build-output }}
        run: |
          if (-not (Test-Path -LiteralPath $env:BUILD_OUTPUT -PathType Container)) {
            throw "Geode output directory does not exist."
          }

          $packages = @(
            Get-ChildItem -LiteralPath $env:BUILD_OUTPUT -Filter "*.geode" -File -Recurse
          )

          if ($packages.Count -eq 0) {
            throw "No .geode package was generated."
          }

          Write-Host "Generated package(s):"
          foreach ($package in $packages) {
            Write-Host $package.FullName
          }

      - name: Upload Veyron Geode package
        uses: actions/upload-artifact@v7
        with:
          name: Veyron-Proyect-Windows-x64
          path: ${{ steps.geode-build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30
