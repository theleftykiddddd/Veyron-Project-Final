name: Build Veyron Proyect (GD 2.2081 / Geode 5.11.2)

on:
  push:
    branches:
      - main
      - "ci/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyron-geode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Test C++ core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure standalone core
        run: cmake -S . -B build-core -DVEYRON_STANDALONE_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Compile core and tests
        run: cmake --build build-core --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build-core --build-config Release --output-on-failure

  build-win64:
    name: Build Geode package (Windows x64)
    runs-on: windows-latest
    needs: core-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Geode mod
        id: geode-build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          cli: latest
          target: Win64
          build-config: Release

      - name: Upload .geode package
        uses: actions/upload-artifact@v7
        with:
          name: Veyron-Proyect-Windows-x64
          path: ${{ steps.geode-build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach .geode to GitHub Release
    runs-on: ubuntu-latest
    needs: build-win64
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built package
        uses: actions/download-artifact@v7
        with:
          name: Veyron-Proyect-Windows-x64
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.geode
          generate_release_notes: true
